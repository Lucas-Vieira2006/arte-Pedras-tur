<!doctype html>
<!-- lang="pt-BR": o site é inteiramente em português. Estava "en", o que
     atrapalha o Google a segmentar o site por idioma e região. -->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a3d62" />

    <!-- Abrir a conexão com estas origens antes de precisar delas: o Lighthouse
         mediu 300 ms de ganho de LCP só no i.ibb.co, que hospeda as imagens dos
         tours cadastrados pelo painel. -->
    <link rel="preconnect" href="https://i.ibb.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Estava como @import no Theme.css e com a URL errada ("css2family" em vez
         de "css2?family"), o que devolvia 404 em HTML: o navegador recusava a
         folha por MIME type e ainda bloqueava a renderização por 780 ms. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
    />

    <!-- Valores padrão. Cada rota sobrescreve os seus via o hook useSeo
         (src/seo/useSeo.js) — isto aqui é o que vale antes do JavaScript rodar
         e para qualquer rota que não defina os próprios. -->
    <title>Arte Pedras Tur — Passeios e Turismo em Foz do Iguaçu</title>
    <meta
      name="description"
      content="Agência de turismo credenciada em Foz do Iguaçu. Cataratas, Itaipu, Marco das Três Fronteiras e mais, com guias credenciados e reserva direta pelo WhatsApp."
    />
    <link rel="canonical" href="https://artepedrastur.com.br/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arte Pedras Tur" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Arte Pedras Tur — Passeios e Turismo em Foz do Iguaçu" />
    <meta
      property="og:description"
      content="Agência de turismo credenciada em Foz do Iguaçu. Cataratas, Itaipu, Marco das Três Fronteiras e mais, com guias credenciados e reserva direta pelo WhatsApp."
    />
    <meta property="og:url" content="https://artepedrastur.com.br/" />
    <meta property="og:image" content="https://artepedrastur.com.br/og/padrao.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
