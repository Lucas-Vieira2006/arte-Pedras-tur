
services:
  banco:
    image: mariadb:latest
    container_name: banco_artepedras
    command: >
      --lower_case_table_names=1
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=defaultdb
    volumes:
      - ./banco/init.sql:/docker-entrypoint-initdb.d/init.sql
      - banco_data:/var/lib/mysql
    networks:
      - app_network
    restart: unless-stopped

  backend:
    image: ghcr.io/lucas-vieira2006/arte-pedras-tur-backend:latest
    build: ./artePedrasTur.api
    container_name: backend_artepedras
    # Sem "ports": só acessível pela rede interna do Docker (Caddy fala com
    # backend:8080 direto). Fechado externamente depois de confirmar TLS
    # estável em produção — antes disso dava pra falar com a API em texto
    # puro pelo IP:8080, ignorando o HTTPS.
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=banco;Port=3306;Database=defaultdb;Uid=database;Pwd=${DB_APP_PASSWORD};SSL Mode=none;
      - Jwt__Key=${JWT_KEY}
      - Cors__Origins=${CORS_ORIGINS}
    depends_on:
      - banco
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    image: ghcr.io/lucas-vieira2006/arte-pedras-tur-frontend:latest
    build: ./artePedrasTur.web
    container_name: frontend_artepedras
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - backend
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:

volumes:
  banco_data:
  caddy_data:
