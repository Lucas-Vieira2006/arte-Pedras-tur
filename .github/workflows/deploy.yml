# Pipeline de CI/CD do Arte Pedras Tur.
#
# LIMITAÇÃO CONHECIDA: o job de deploy roda "docker compose up -d --build"
# dentro da própria VM e2-micro (1 vCPU compartilhada, 1 GB RAM), que é onde
# a aplicação já roda em produção. Isso é lento e disputa memória com os
# containers que já estão de pé durante o build. Melhoria futura: buildar a
# imagem no runner do GitHub Actions (que tem recursos de sobra) e publicar
# num registry (ex.: GitHub Container Registry), fazendo a VM só rodar
# "docker compose pull && docker compose up -d" com a imagem já pronta, em
# vez de compilar em produção.

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend
        run: dotnet restore artePedrasTur.api/artePedrasTur.sln

      - name: Build backend (com analisadores estáticos como erro)
        # -warnaserror:CA promove os analisadores Roslyn (Microsoft.CodeAnalysis.*)
        # já habilitados por padrão em projetos .NET 8 de warning pra erro. Hoje o
        # projeto está limpo de violações CA (validado localmente antes de ligar
        # o gate), então isso funciona como análise estática real, não cosmética.
        run: dotnet build artePedrasTur.api/artePedrasTur.sln --no-restore --configuration Release -warnaserror:CA

      - name: Test backend
        run: dotnet test artePedrasTur.api/artePedrasTur.sln --no-build --configuration Release

      - name: Lint backend (dotnet format)
        run: dotnet format artePedrasTur.api/artePedrasTur.sln --verify-no-changes

      - name: Check backend dependencies for known vulnerabilities
        # dotnet list --vulnerable sempre retorna exit code 0, então o gate real
        # é o grep abaixo: se aparecer a frase de aviso, a pipeline falha.
        run: |
          output=$(dotnet list artePedrasTur.api/artePedrasTur.sln package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "Dependência vulnerável encontrada no backend."
            exit 1
          fi

      - name: Publish backend (gera artefato de build)
        run: dotnet publish artePedrasTur.api/artePedrasTur.api.csproj --no-build --configuration Release -o publish/backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish/backend
          retention-days: 7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: artePedrasTur.web/package-lock.json

      - name: Install frontend dependencies
        working-directory: artePedrasTur.web
        run: npm ci

      - name: Lint frontend (eslint)
        working-directory: artePedrasTur.web
        run: npm run lint

      - name: Check frontend dependencies for known vulnerabilities
        # Bloqueia só em severidade crítica. Hoje existem achados "high" (ex.:
        # vite, react-router) sem correção não-destrutiva disponível (exigem bump
        # de versão major) — tratados como risco aceito e documentado em
        # docs/pipeline-cicd.md, não escondidos. O relatório completo (todas as
        # severidades) continua aparecendo no log deste passo mesmo sem falhar.
        working-directory: artePedrasTur.web
        run: npm audit --audit-level=critical

      - name: Build frontend
        working-directory: artePedrasTur.web
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: artePedrasTur.web/dist
          retention-days: 7

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            cd ~/arte-Pedras-tur
            git pull
            docker compose build frontend
            docker compose build backend
            docker compose up -d

      - name: Health check
        run: |
          sleep 15
          curl -f "http://${{ secrets.SSH_HOST }}:8080/api/public/tours"
