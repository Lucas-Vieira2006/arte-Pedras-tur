# Pipeline de CI/CD do Arte Pedras Tur.
#
# LIMITAÇÃO CONHECIDA: o job de deploy roda "docker compose up -d --build"
# dentro da própria VM e2-micro (1 vCPU compartilhada, 1 GB RAM), que é onde
# a aplicação já roda em produção. Isso é lento e disputa memória com os
# containers que já estão de pé durante o build. Melhoria futura: buildar a
# imagem no runner do GitHub Actions (que tem recursos de sobra) e publicar
# num registry (ex.: GitHub Container Registry), fazendo a VM só rodar
# "docker compose pull && docker compose up -d" com a imagem já pronta, em
# vez de compilar em produção.

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend
        run: dotnet restore artePedrasTur.api/artePedrasTur.sln

      - name: Build backend
        run: dotnet build artePedrasTur.api/artePedrasTur.sln --no-restore --configuration Release

      - name: Test backend
        run: dotnet test artePedrasTur.api/artePedrasTur.sln --no-build --configuration Release

      - name: Lint backend (dotnet format)
        run: dotnet format artePedrasTur.api/artePedrasTur.sln --verify-no-changes

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: artePedrasTur.web/package-lock.json

      - name: Install frontend dependencies
        working-directory: artePedrasTur.web
        run: npm ci

      - name: Build frontend
        working-directory: artePedrasTur.web
        run: npm run build

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            cd ~/arte-Pedras-tur
            git pull
            docker compose up -d --build

      - name: Health check
        run: |
          sleep 15
          curl -f "http://${{ secrets.SSH_HOST }}:8080/api/public/tours"
