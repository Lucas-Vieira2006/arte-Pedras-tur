# Pipeline de CI/CD do Arte Pedras Tur.
#
# As imagens Docker são buildadas no runner do GitHub Actions (job
# build-and-push) e publicadas no GHCR — não são mais compiladas dentro da
# VM e2-micro (1 vCPU compartilhada, 1 GB RAM), que travava disputando
# CPU/memória com os containers de produção durante o build. O job de
# deploy só roda "docker compose pull" e sobe a imagem já pronta.
#
# Os pacotes ghcr.io/lucas-vieira2006/arte-pedras-tur-{backend,frontend}
# precisam estar com visibilidade pública (Package settings > Danger Zone
# > Change visibility), senão o "docker compose pull" na VM falha por
# falta de credencial.
#
# Cada imagem também é publicada com a tag do SHA do commit, além de
# "latest". Rollback manual: entrar na VM via SSH e rodar
# "docker compose pull backend frontend" trocando a tag da imagem no
# docker-compose.yml (ou um "docker tag ghcr.io/.../backend:<sha-bom>
# ghcr.io/.../backend:latest" seguido de "docker compose up -d").

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore backend
        run: dotnet restore artePedrasTur.api/artePedrasTur.sln

      - name: Build backend (com analisadores estáticos como erro)
        # -warnaserror:CA promove os analisadores Roslyn (Microsoft.CodeAnalysis.*)
        # já habilitados por padrão em projetos .NET 8 de warning pra erro. Hoje o
        # projeto está limpo de violações CA (validado localmente antes de ligar
        # o gate), então isso funciona como análise estática real, não cosmética.
        run: dotnet build artePedrasTur.api/artePedrasTur.sln --no-restore --configuration Release -warnaserror:CA

      - name: Test backend
        run: dotnet test artePedrasTur.api/artePedrasTur.sln --no-build --configuration Release

      - name: Lint backend (dotnet format)
        run: dotnet format artePedrasTur.api/artePedrasTur.sln --verify-no-changes

      - name: Check backend dependencies for known vulnerabilities
        # dotnet list --vulnerable sempre retorna exit code 0, então o gate real
        # é o grep abaixo: se aparecer a frase de aviso, a pipeline falha.
        run: |
          output=$(dotnet list artePedrasTur.api/artePedrasTur.sln package --vulnerable --include-transitive 2>&1)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "Dependência vulnerável encontrada no backend."
            exit 1
          fi

      - name: Publish backend (gera artefato de build)
        run: dotnet publish artePedrasTur.api/artePedrasTur.api.csproj --no-build --configuration Release -o publish/backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish/backend
          retention-days: 7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: artePedrasTur.web/package-lock.json

      - name: Install frontend dependencies
        working-directory: artePedrasTur.web
        run: npm ci

      - name: Lint frontend (eslint)
        working-directory: artePedrasTur.web
        run: npm run lint

      - name: Check frontend dependencies for known vulnerabilities
        # Bloqueia só em severidade crítica. Hoje existem achados "high" (ex.:
        # vite, react-router) sem correção não-destrutiva disponível (exigem bump
        # de versão major) — tratados como risco aceito e documentado em
        # docs/pipeline-cicd.md, não escondidos. O relatório completo (todas as
        # severidades) continua aparecendo no log deste passo mesmo sem falhar.
        working-directory: artePedrasTur.web
        run: npm audit --audit-level=critical

      - name: Build frontend
        working-directory: artePedrasTur.web
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: artePedrasTur.web/dist
          retention-days: 7

  build-and-push:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem do backend
        uses: docker/build-push-action@v6
        with:
          context: ./artePedrasTur.api
          push: true
          tags: |
            ghcr.io/lucas-vieira2006/arte-pedras-tur-backend:latest
            ghcr.io/lucas-vieira2006/arte-pedras-tur-backend:${{ github.sha }}

      - name: Build e push da imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: ./artePedrasTur.web
          push: true
          tags: |
            ghcr.io/lucas-vieira2006/arte-pedras-tur-frontend:latest
            ghcr.io/lucas-vieira2006/arte-pedras-tur-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            cd ~/arte-Pedras-tur
            git pull
            docker compose pull backend frontend
            docker compose up -d

      - name: Health check
        # Via HTTPS/domínio, não mais via IP:8080 direto: a porta 8080 do
        # backend não é mais publicada pro host (ver docker-compose.yml),
        # então este é também o teste real de ponta a ponta (Caddy + TLS
        # + backend) depois de cada deploy.
        run: |
          sleep 15
          curl -f https://turismo.artepedrastur.com.br/api/public/tours
